name: Update room air quality

on:
  # GitHub's own `schedule:` trigger was unreliable (didn't fire for over an hour
  # after setup) and, once it did start working, ran ALONGSIDE cron-job.org's
  # external trigger -- firing the workflow roughly twice as often as intended
  # and overwhelming GitHub Pages' deployment queue (each commit triggers a
  # Pages rebuild; Pages only processes one at a time, so overlapping commits
  # show up as failed/superseded deployments). Triggering is now handled
  # entirely by an external cron-job.org job calling this workflow's
  # workflow_dispatch endpoint every 10 minutes -- see the setup notes in
  # tuya_room_air.py's header comment.
  workflow_dispatch: {}       # lets cron-job.org (and manual "Run workflow") trigger this

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sensor reading from Tuya
        env:
          TUYA_API_BASE: ${{ secrets.TUYA_API_BASE }}
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
        run: python tuya_room_air.py

      - name: Commit updated reading (only if it changed)
        run: |
          git config user.name "room-air-bot"
          git config user.email "actions@users.noreply.github.com"
          git add room_air.json
          git diff --staged --quiet || git commit -m "Update room air reading"
          git push
